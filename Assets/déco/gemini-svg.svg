<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 50" width="100%" height="auto">
  <style>
    .card { fill: #ffffff; stroke: #d1d5db; stroke-width: 1px; rx: 3px; }
    .text-visa { font-family: Arial, sans-serif; font-weight: 900; font-style: italic; font-size: 15px; fill: #1434CB; }
    .text-amex { font-family: Arial, sans-serif; font-weight: bold; font-size: 5.5px; fill: #ffffff; text-anchor: middle; }
    .text-pay { font-family: 'Product Sans', Arial, sans-serif; font-size: 16px; fill: #5f6368; }
    .text-applepay { font-family: -apple-system, sans-serif; font-size: 18px; font-weight: 600; fill: #000000; }
    .text-discover { font-family: sans-serif; font-weight: bold; font-size: 8px; fill: #000000; }
  </style>

  <!-- 1. Visa -->
  <g transform="translate(10, 10)">
    <rect width="48" height="30" class="card" />
    <text x="6" y="20" class="text-visa">VISA</text>
    <path d="M 6 12 L 10 12 L 8 20 L 6 20 Z" fill="#F7B600" />
  </g>

  <!-- 2. Mastercard -->
  <g transform="translate(70, 10)">
    <rect width="48" height="30" class="card" />
    <circle cx="19" cy="15" r="9" fill="#EB001B" />
    <circle cx="29" cy="15" r="9" fill="#F79E1B" opacity="0.9" />
  </g>

  <!-- 3. Discover -->
  <g transform="translate(130, 10)">
    <rect width="48" height="30" class="card" />
    <text x="3" y="18" class="text-discover">DISC<tspan fill="#F68121">O</tspan>VER</text>
    <path d="M 15 29 C 25 29 35 25 48 20 L 48 29 C 48 29.5 47.5 30 47 30 L 15 30 Z" fill="#F68121" />
  </g>

  <!-- 4. American Express -->
  <g transform="translate(190, 10)">
    <rect width="48" height="30" class="card" />
    <rect x="2" y="2" width="44" height="26" fill="#016FD0" rx="1.5" />
    <text x="24" y="13" class="text-amex">AMERICAN</text>
    <text x="24" y="22" class="text-amex">EXPRESS</text>
  </g>

  <!-- 5. Google Pay -->
  <g transform="translate(250, 10)">
    <path d="M16.5 9.8c0-.7-.1-1.3-.2-1.9H8.5v3.6h4.5c-.2 1.2-.9 2.2-1.9 2.8v2.3h3.1c1.8-1.7 2.8-4.1 2.8-6.8z" fill="#4285F4"/>
    <path d="M8.5 18c2.3 0 4.2-.7 5.6-2l-3.1-2.3c-.8.5-1.7.8-2.5.8-2 0-3.6-1.3-4.2-3.1H1.1v2.4C2.5 16.5 5.3 18 8.5 18z" fill="#34A853"/>
    <path d="M4.3 11.4c-.2-.5-.2-1.1-.2-1.7s.1-1.2.2-1.7V5.7H1.1C.4 7 .0 8.4.0 9.8s.4 2.8 1.1 4.1l3.2-2.5z" fill="#FBBC05"/>
    <path d="M8.5 3.5c1.2 0 2.3.4 3.2 1.2l2.4-2.4C12.7 1 10.7 0 8.5 0 5.3 0 2.5 1.5 1.1 4.1l3.2 2.5c.6-1.8 2.2-3.1 4.2-3.1z" fill="#EA4335"/>
    <text x="21" y="17" class="text-pay">Pay</text>
  </g>

  <!-- 6. Apple Pay -->
  <g transform="translate(315, 10)">
    <path d="M11.2 6.6c0-1.7 1.4-2.8 1.5-2.9-1-1.4-2.5-1.6-3-1.6-1.3-.1-2.5.8-3.1.8-.7 0-1.7-.8-2.8-.8-1.5 0-2.8.8-3.6 2.1-1.5 2.7-.4 6.7 1.1 8.8.7 1 1.6 2.1 2.7 2.1 1 0 1.5-.7 2.8-.7 1.3 0 1.7.7 2.8.7 1.1 0 1.9-1.2 2.6-2.1.8-1.2 1.2-2.4 1.2-2.5 0 0-2.2-.8-2.2-3.3zm-1.8-4.2c.5-.7.9-1.6.8-2.4-.7.1-1.7.5-2.2 1.2-.5.6-.9 1.5-.8 2.4.8 0 1.7-.5 2.2-1.2z" fill="#000000"/>
    <text x="18" y="17" class="text-applepay">Pay</text>
  </g>

  <!-- 7. Secured by PayPal -->
  <g transform="translate(380, 10)">
    <rect width="95" height="30" class="card" />
    <!-- Section bleue inclinée -->
    <path d="M 0 3 L 0 27 C 0 28.6 1.4 30 3 30 L 45 30 L 50 0 L 3 0 C 1.4 0 0 1.4 0 3 Z" fill="#003087" />
    <text x="5" y="17" font-family="Arial, sans-serif" font-size="7.5px" fill="#ffffff">Secured by</text>
    <text x="52" y="19" font-family="Arial, sans-serif" font-style="italic" font-weight="bold" font-size="11px" fill="#003087">Pay<tspan fill="#0079C1">Pal</tspan></text>
  </g>
</svg>
