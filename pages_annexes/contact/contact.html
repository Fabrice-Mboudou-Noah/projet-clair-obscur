<main role="main">
    <section class="formu">
    <h1>Contacter le support</h1>
    <p>Remplissez ce formulaire et notre équipe vous répondra sous 24h. Les champs marqués d'un astérisque sont obligatoires.</p>
        <form action="https://formspree.io/f/xoejqlyg" method="POST">

            <div class="nom">
                <label for="nom">Nom complet </label>
                <input type="text" id="nom" name="nom" required aria-required="true" autocomplete="name">
            </div>

            <div class="mail">
                <label for="email">Adresse e-mail </label>
                <input type="email" id="email" name="email" required aria-required="true" autocomplete="email">
            </div>

            <div class="message">
                <label for="message">Votre message </label>
                <textarea id="message" name="message" rows="6" required aria-required="true"></textarea>
                <button type="submit"> Envoyer la demande</button>
            </div>



        </form>
    </section>
</main>

<footer role="contentinfo">
    <div id="support">
        <h2>Support</h2>
